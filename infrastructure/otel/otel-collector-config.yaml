receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 256

exporters:
  otlphttp:
    endpoint: http://api:8000/v1
    tls:
      insecure: true
  logging:
    verbosity: normal

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp, logging]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp, logging]
