[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infrastructure-intelligence-platform"
version = "1.0.0"
description = "Real-Time Data Science System for Telemetry Ingestion, Multi-Model Anomaly Detection, Incident Risk Prediction, and Service Reliability Operations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "river>=0.21.0",
    "networkx>=3.3",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "websockets>=13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "locust>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "services*", "simulator*", "data_science*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
